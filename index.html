.scene{min-height:min(730px,calc(100vh - 135px));background:linear-gradient(90deg,#788d72 0 45%,#657b63 45% 55%,#788d72 55% 100%)}.cloud{display:none}.street{left:46%;right:auto;top:0;bottom:0;width:8%;height:auto;background:linear-gradient(90deg,#4d5359,#686f76 48%,#4d5359);border:0;border-left:6px solid #c8c3b8;border-right:6px solid #c8c3b8}.street:after{left:50%;right:auto;top:0;bottom:0;border:0;border-left:3px dashed #f5e899}.buildings{left:auto;right:auto;top:1.5%;bottom:1.5%;height:auto;width:44%;grid-template-columns:none;grid-template-rows:repeat(var(--columns,4),1fr);align-items:stretch;gap:clamp(3px,.65vh,7px)}.buildings.north{left:.5%;top:1.5%;height:auto}.buildings.south{right:.5%;top:1.5%;height:auto;align-items:stretch}.slot,.south .slot{min-height:0;height:auto;align-items:center;justify-content:center}.building{--roof:#b8b2a5;--edge:#716b60;position:relative;width:min(94%,340px);height:88%;min-height:70px;aspect-ratio:auto;border:0;border-radius:5px;overflow:hidden;background:linear-gradient(135deg,#fff3 0 15%,transparent 16% 80%,#0002 81%),repeating-linear-gradient(90deg,transparent 0 24%,#0000000b 24% 25%),var(--roof);box-shadow:0 7px 0 var(--edge),0 12px 18px #15201770,inset 0 0 0 5px #f3efe6aa;cursor:pointer;z-index:3}.building:before{content:"";position:absolute;inset:7%;border:2px solid #ffffff70;box-shadow:inset 0 0 0 2px #0001;pointer-events:none}.building.roof-1{border-radius:18px 4px 18px 4px}.building.roof-2{clip-path:polygon(5% 0,95% 0,100% 14%,100% 86%,95% 100%,5% 100%,0 86%,0 14%)}.building.roof-3{border-radius:38px 7px 7px 38px}.building.roof-4{border-radius:7px;transform:rotate(-1deg)}.roof-grid{position:absolute;left:11%;right:11%;top:16%;bottom:16%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:8% 5%}.roof-grid i{border-radius:2px;background:linear-gradient(145deg,#9bc2cf,#3d7184);border:2px solid #dce9e9;box-shadow:2px 2px 3px #0004}.roof-unit{position:absolute;width:17%;height:21%;background:repeating-linear-gradient(90deg,#d8d5cc 0 18%,#8d918e 18% 30%);border:2px solid #686c69;box-shadow:2px 3px 3px #0004}.roof-unit.u1{left:8%;top:8%}.roof-unit.u2{right:8%;bottom:9%;transform:rotate(90deg)}.roof-pipe{position:absolute;right:9%;top:10%;width:10px;height:10px;border-radius:50%;background:#777;border:3px solid #ddd;box-shadow:-18px 9px 0 -1px #777}.place-sign{position:absolute;z-index:5;left:50%;top:50%;translate:-50% -50%;width:clamp(38px,4.3vw,55px);height:clamp(38px,4.3vw,55px);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:clamp(22px,3vw,34px);box-shadow:0 4px 10px #0007;border:3px solid var(--edge)}.slot.has-back{flex-direction:column;gap:0}.slot.has-back .building{position:relative;left:auto;translate:none;height:50%;width:min(88%,300px);min-height:34px;border-radius:4px;clip-path:none;transform:none;box-shadow:inset 0 0 0 4px #f3efe6aa}.north .slot.has-back .building:not(.back),.north .slot.has-back .building.back,.south .slot.has-back .building:not(.back),.south .slot.has-back .building.back{top:auto;bottom:auto}.slot.has-back .building.back{border-radius:5px 5px 0 0;border-bottom:1px solid var(--edge)}.slot.has-back .building:not(.back){border-radius:0 0 5px 5px;border-top:1px solid var(--edge)}.slot.has-back .roof-grid{top:13%;bottom:13%;gap:3%}.slot.has-back .roof-unit{height:28%}.slot.has-back .place-sign{width:31px;height:31px;font-size:19px;border-width:2px}.building.back{z-index:2;filter:saturate(.82) brightness(.9)}.building.correct{background-color:var(--roof);box-shadow:0 7px 0 #16895f,0 0 0 7px #7ff0bd,inset 0 0 0 5px #d9ffed}.building.wrong{background-color:var(--roof);box-shadow:0 7px 0 #b53d45,0 0 0 7px #ff9c9f,inset 0 0 0 5px #ffe1e1}.street-item{font-size:clamp(27px,4vw,48px);filter:drop-shadow(0 5px 4px #0007)}.direction-scene{background:#788d72}.direction-road{top:0;bottom:0;left:46%;right:auto;width:8%;height:auto;border:0;border-left:5px solid #ded8ca;border-right:5px solid #ded8ca}.direction-road </style></head><body>
<div class="shell"><header class="top"><button class="round-btn" id="home">🏙️</button><div class="top-right"><span class="version">V8</span><button class="round-btn" id="sound">🔊</button></div></header>
<section class="setup" id="setup"><div class="setup-card"><div class="citymark">🛣️</div><button class="play" id="play">▶</button><label class="round-setting">Rounds <input class="round-input" id="roundInput" type="number" inputmode="numeric" min="1" max="40" value="10"></label></div></section>
<section class="game hidden" id="game"><div class="hud"><button class="round-btn" id="back">⌂</button><div class="chip">🧩 <span id="roundNo">1</span></div><div class="chip">⭐ <span id="score">0</span></div><div class="progress"><i id="bar"></i></div><button class="round-btn" id="tutorialBtn">?</button><button class="mic" id="mic">🎙️</button></div><div class="scene" id="scene"><span class="cloud c1">☁️</span><span class="cloud c2">☁️</span><div class="buildings north" id="north"></div><div class="street"></div><div class="buildings south" id="south"></div><div class="feedback hidden" id="feedback"></div></div><div class="judge"><button class="wrong-btn" id="manualWrong">✕</button><button class="correct-btn" id="manualCorrect">✓</button></div></section></div>
<div class="overlay hidden" id="tutorial"><div class="modal"><div class="tutorial-head"><div class="dots"><i class="dot active"></i><i class="dot"></i></div><button class="close" id="closeTutorial">✕</button></div><div id="placesPage"><div class="tutorial-grid" id="tutorialPlaces"></div></div><div class="hidden" id="directionsPage"><div class="direction-scene"><div class="direction-road"></div><span class="demo-item" style="left:12%;top:17%">🏦</span><span class="demo-item" style="left:39%;top:2%;font-size:35px">📚</span><span class="demo-item" style="left:44%;top:17%">🏫</span><span class="demo-item" style="left:77%;top:17%">🏥</span><span class="demo-item" style="left:47%;top:52%">🚗</span><span class="demo-item" style="left:44%;top:79%">🛒</span></div><div class="direction-chips" id="directionGrid"></div></div><div class="page-actions"><button id="prevPage">←</button><button id="nextPage">→</button></div></div></div>
<div class="overlay hidden" id="finish"><div class="finish-card"><div class="trophy">🏆</div><div class="final-score" id="finalScore">0</div><div class="finish-actions"><button id="again">↻</button><button id="finishHome">⌂</button></div></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const PLACES=[['hospital','🏥',['clinic','medical center','medical centre']],['bank','🏦',['money bank']],['school','🏫',['high school']],['police station','🚓',['police','police office']],['bus stop','🚏',['bus station']],['cinema','🎬',['theater','theatre','movie theater','movie theatre']],['metro station','🚇',['metro','subway','subway station','train','train station','railway station']],['fire station','🚒',['fire department']],['library','📚',['book place']],['supermarket','🛒',['market','grocery','grocery store','shop','shopping center','shopping centre','mall']],['restaurant','🍽️',['cafe','diner','food place']],['pharmacy','💊',['drugstore','chemist']],['park','🌳',['garden','playground']],['museum','🏛️',['gallery']],['hotel','🛏️',['motel','inn']],['airport','✈️',['air port']],['post office','📮',['post','mail office']],['stadium','🏟️',['sports center','sports centre','arena']],['bakery','🫓',['bread','bread shop','flatbread']],['university','🎓',['college','campus']],['petrol station','⛽',['gas station','fuel station','petrol','gas','fuel']]].map(([name,icon,aliases])=>({name,icon,aliases}));
const STREET_OBJECTS=[['car','🚗',['vehicle','automobile']],['person','🚶',['boy','girl','man','woman','pedestrian','people']],['motorcycle','🏍️',['motorbike']],['bicycle','🚲',['bike','cycle']],['bus','🚌',['coach']],['taxi','🚕',['cab','taxi car']]];const RELATIONS=['across from','in front of','behind','next to','left','right','between'];
let roundTotal=10,round=0,score=0,places=[],streetObjects=[],facts=[],task=null,relationPlan=[],columns=4,locked=false,muted=false,recognition=null,recognitionEpoch=0,voiceWanted=false,retry=0,tutorialPage=0,resumeAfterTutorial=false,sceneSignatures=new Set();
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}const pick=a=>a[Math.floor(Math.random()*a.length)];
const ROOFS=[['#bbb5a8','#70695d'],['#a9b4b5','#5c696b'],['#c5aa91','#765f4b'],['#9ba6a0','#58635f'],['#b9a1a2','#70595a']];
function buildScene(requiredRelation){let signature='',attempt=0;do{columns=3+Math.floor(Math.random()*3);const baseCount=columns*2,addBehind=requiredRelation==='behind'||Math.random()<.7,count=Math.min(PLACES.length,baseCount+(addBehind?1:0)),chosen=shuffle(PLACES).slice(0,count);places=[];let k=0;for(const side of shuffle(['north','south']))for(let slot=0;slot<columns;slot++)places.push({...chosen[k++],side,slot});if(addBehind){const front=pick(places);places.push({...chosen[k],side:front.side,slot:front.slot,back:true})}signature=places.map(p=>`${p.name}:${p.side}:${p.slot}:${p.back?'b':'f'}`).join('|');attempt++}while(sceneSignatures.has(signature)&&attempt<20);sceneSignatures.add(signature);$('#north').style.setProperty('--columns',columns);$('#south').style.setProperty('--columns',columns);renderSide('north');renderSide('south');const objectCount=Math.min(columns,2+Math.floor(Math.random()*3)),mains=places.filter(p=>!p.back),chosenMains=shuffle(mains).slice(0,objectCount);streetObjects=shuffle(STREET_OBJECTS).slice(0,objectCount).map((o,i)=>{const near=chosenMains[i];return{name:o[0],icon:o[1],aliases:o[2],x:near.side==='north'?48:52,y:((near.slot+.5)/columns)*100,near}});renderStreetObjects();buildFacts();buildTutorial()}
function renderSide(side){const root=$('#'+side);root.innerHTML='';for(let slot=0;slot<columns;slot++){const group=places.filter(p=>p.side===side&&p.slot===slot).sort((a,b)=>Number(b.back)-Number(a.back)),wrap=document.createElement('div');wrap.className='slot'+(group.some(p=>p.back)?' has-back':'');group.forEach((p,i)=>{const b=document.createElement('button'),palette=ROOFS[(slot+i+(side==='south'?2:0))%ROOFS.length];b.className=`building roof-${(slot+i)%5}`+(p.back?' back':'');b.dataset.name=p.name;b.style.setProperty('--roof',palette[0]);b.style.setProperty('--edge',palette[1]);b.innerHTML=`<span class="roof-grid">${'<i></i>'.repeat(8)}</span><span class="roof-unit u1"></span><span class="roof-unit u2"></span><span class="roof-pipe"></span><span class="place-sign">${p.icon}</span>`;b.onclick=()=>manualEntity(p.name);wrap.append(b)});root.append(wrap)}}
function renderStreetObjects(){$$('.street-item').forEach(x=>x.remove());streetObjects.forEach(o=>{const b=document.createElement('button');b.className='street-item';b.dataset.name=o.name;b.style.left=o.x+'%';b.style.top=o.y+'%';b.textContent=o.icon;b.onclick=()=>manualEntity(o.name);$('#scene').append(b)})}
function sentence(subject,relation,targets){if(relation==='between')return `The ${subject} is between the ${targets[0]} and the ${targets[1]}.`;if(relation==='left'||relation==='right')return `The ${subject} is on the ${relation} of the ${targets[0]}.`;return `The ${subject} is ${relation} the ${targets[0]}.`}function addFact(subject,relation,targets,kind='place'){facts.push({subject,relation,targets,kind,sentence:sentence(subject,relation,targets)})}
function buildFacts(){facts=[];const mains=places.filter(p=>!p.back);for(const side of ['north','south']){const row=mains.filter(p=>p.side===side).sort((a,b)=>a.slot-b.slot);for(let i=0;i<row.length-1;i++){addFact(row[i].name,'next to',[row[i+1].name]);addFact(row[i+1].name,'next to',[row[i].name])}for(let i=1;i<row.length-1;i++)addFact(row[i].name,'between',[row[i-1].name,row[i+1].name])}for(let slot=0;slot<columns;slot++){const left=mains.find(p=>p.side==='north'&&p.slot===slot),right=mains.find(p=>p.side==='south'&&p.slot===slot);if(left&&right){addFact(left.name,'left',[right.name]);addFact(right.name,'right',[left.name]);addFact(left.name,'across from',[right.name]);addFact(right.name,'across from',[left.name])}}const back=places.find(p=>p.back);if(back){const front=places.find(p=>!p.back&&p.side===back.side&&p.slot===back.slot);addFact(back.name,'behind',[front.name])}streetObjects.forEach(o=>addFact(o.name,'in front of',[o.near.name],'object'))}
function buildTask(requiredRelation){const matching=facts.filter(f=>f.relation===requiredRelation),f=pick(matching.length?matching:facts),mode=Math.random()<.5?'name':'relation';if(mode==='name'){const answers=f.relation==='next to'?[...new Set(facts.filter(x=>x.relation==='next to'&&x.targets[0]===f.targets[0]).map(x=>x.subject))]:[f.subject],where=f.relation==='left'||f.relation==='right'?`on the ${f.relation} of`:f.relation;return{mode,fact:f,prompt:f.relation==='between'?`What is between the ${f.targets[0]} and the ${f.targets[1]}?`:`What is ${where} the ${f.targets[0]}?`,answers}}return{mode,fact:f,prompt:f.relation==='between'?`Where is the ${f.subject} in relation to the ${f.targets[0]} and the ${f.targets[1]}?`:`Where is the ${f.subject} in relation to the ${f.targets[0]}?`,answers:[f.relation]}}
const TUTORIAL_EXAMPLES={'across from':'The supermarket is across from the school.','in front of':'The car is in front of the school.','behind':'The library is behind the school.','next to':'The bank is next to the school.','left':'The bank is left of the school.','right':'The hospital is right of the school.','between':'The school is between the bank and the hospital.'};
function buildTutorial(){$('#tutorialPlaces').innerHTML=places.map(p=>`<button class="tutorial-place" data-name="${p.name}">${p.icon}</button>`).join('')+streetObjects.map(o=>`<button class="tutorial-place" data-name="${o.name}">${o.icon}</button>`).join('');$$('.tutorial-place').forEach(b=>b.onclick=()=>speak(b.dataset.name));$('#directionGrid').innerHTML=RELATIONS.map(r=>`<button class="direction-chip" data-relation="${r}">${r}</button>`).join('');$$('.direction-chip').forEach(b=>b.onclick=()=>{$$('.direction-chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');speak(TUTORIAL_EXAMPLES[b.dataset.relation])})}
function makeRelationPlan(total){const plan=shuffle(RELATIONS).slice(0,Math.min(total,RELATIONS.length));while(plan.length<total)plan.push(pick(RELATIONS));return shuffle(plan)}function startGame(){roundTotal=Math.max(1,Math.min(40,parseInt($('#roundInput').value,10)||10));$('#roundInput').value=roundTotal;round=score=0;relationPlan=makeRelationPlan(roundTotal);sceneSignatures.clear();$('#score').textContent=0;$('#setup').classList.add('hidden');$('#finish').classList.add('hidden');$('#game').classList.remove('hidden');nextTask()}function nextTask(){if(round>=roundTotal)return finishGame();const requiredRelation=relationPlan[round];buildScene(requiredRelation);task=buildTask(requiredRelation);locked=false;retry=0;clearMarks();$('#roundNo').textContent=round+1;$('#bar').style.width=(round/roundTotal*100)+'%';setTimeout(ask,350)}function ask(){speak(task.prompt,()=>setTimeout(startRecognition,350))}
function normalize(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}function contains(t,p){return (` ${normalize(t)} `).includes(` ${normalize(p)} `)}function entity(name){return places.find(p=>p.name===name)||streetObjects.find(o=>o.name===name)}function relationAnswers(r){const map={'next to':['next to','beside','left','right'],'left':['left','on the left','next to','beside'],'right':['right','on the right','next to','beside'],'across from':['across from','across','opposite'],'in front of':['in front of','in front','front'],'behind':['behind'],'between':['between']};return map[r]||[r]}function answerMatch(text){if(task.mode==='relation')return relationAnswers(task.fact.relation).some(a=>contains(text,a));return task.answers.some(name=>{const e=entity(name);return[e.name,...e.aliases].some(a=>contains(text,a))})}function knownWrong(text){if(task.mode==='relation')return RELATIONS.flatMap(relationAnswers).some(r=>contains(text,r));return[...places,...streetObjects].some(e=>[e.name,...e.aliases].some(a=>contains(text,a)))}
function matchedEntity(text){if(task.mode!=='name')return null;return task.answers.find(name=>{const e=entity(name);return[e.name,...e.aliases].some(a=>contains(text,a))})||null}function evaluate(heard){if(locked)return;for(const text of heard){if(task.mode==='relation'&&answerMatch(text))return grade(true);const matched=matchedEntity(text);if(matched)return grade(true,matched)}if(heard.some(knownWrong))return grade(false);retry++;if(retry<2)speak('Please say it again.',()=>setTimeout(startRecognition,500));else grade(false)}function manualEntity(name){if(locked||task.mode!=='name')return;grade(task.answers.includes(name),name)}function mark(ok,answerName){const e=entity(answerName||task.fact.subject),el=e&&$(`[data-name="${e.name}"]`);el?.classList.add(ok?'correct':'wrong')}function grade(ok,answerName){if(locked)return;locked=true;stopRecognition();mark(ok,answerName);$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=ok?'✓':'✕';if(ok){score++;$('#score').textContent=score}const feedbackFact=ok&&answerName&&task.mode==='name'?(facts.find(f=>f.subject===answerName&&f.relation===task.fact.relation&&f.targets.join('|')===task.fact.targets.join('|'))||task.fact):task.fact;speak((ok?'Correct. ':'Wrong. ')+feedbackFact.sentence,()=>setTimeout(()=>{round++;nextTask()},650))}function clearMarks(){$$('.building,.street-item').forEach(x=>x.classList.remove('correct','wrong'));$('#feedback').className='feedback hidden'}
function speak(text,after){stopRecognition();if(muted||!('speechSynthesis'in window)){setTimeout(()=>after?.(),180);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;u.onend=()=>after?.();u.onerror=()=>after?.();speechSynthesis.speak(u)}
function startRecognition(){if(locked||!task)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;voiceWanted=true;if(!SR){$('#mic').classList.add('listening');return}stopRecognition(false);voiceWanted=true;const token=++recognitionEpoch,r=new SR();recognition=r;r.lang='en-US';r.continuous=false;r.interimResults=false;r.maxAlternatives=5;r.onstart=()=>token===recognitionEpoch&&$('#mic').classList.add('listening');r.onresult=e=>{if(token!==recognitionEpoch)return;voiceWanted=false;evaluate([...e.results[0]].map(x=>x.transcript))};r.onerror=e=>{if(token!==recognitionEpoch)return;if(['not-allowed','service-not-allowed'].includes(e.error))voiceWanted=false};r.onend=()=>{if(token!==recognitionEpoch)return;recognition=null;$('#mic').classList.remove('listening');if(voiceWanted&&!locked)setTimeout(startRecognition,100)};try{r.start()}catch{recognition=null;if(voiceWanted&&!locked)setTimeout(startRecognition,160)}}function stopRecognition(disable=true){if(disable)voiceWanted=false;recognitionEpoch++;try{recognition?.abort()}catch{}recognition=null;$('#mic').classList.remove('listening')}
function openTutorial(){resumeAfterTutorial=!locked;stopRecognition();speechSynthesis?.cancel();tutorialPage=0;showTutorialPage();$('#tutorial').classList.remove('hidden')}function showTutorialPage(){$('#placesPage').classList.toggle('hidden',tutorialPage!==0);$('#directionsPage').classList.toggle('hidden',tutorialPage!==1);$$('.dot').forEach((d,i)=>d.classList.toggle('active',i===tutorialPage));$('#prevPage').disabled=tutorialPage===0;$('#nextPage').disabled=tutorialPage===1}function closeTutorial(){speechSynthesis?.cancel();$('#tutorial').classList.add('hidden');if(resumeAfterTutorial)setTimeout(ask,250)}function finishGame(){stopRecognition();speechSynthesis?.cancel();$('#bar').style.width='100%';$('#finalScore').textContent=`${score}/${roundTotal}`;$('#finish').classList.remove('hidden')}function goHome(){stopRecognition();speechSynthesis?.cancel();$('#game').classList.add('hidden');$('#finish').classList.add('hidden');$('#tutorial').classList.add('hidden');$('#setup').classList.remove('hidden')}
$('#play').onclick=startGame;$('#again').onclick=startGame;$('#back').onclick=goHome;$('#home').onclick=goHome;$('#finishHome').onclick=goHome;$('#mic').onclick=ask;$('#manualCorrect').onclick=()=>grade(true);$('#manualWrong').onclick=()=>grade(false);$('#tutorialBtn').onclick=openTutorial;$('#closeTutorial').onclick=closeTutorial;$('#prevPage').onclick=()=>{tutorialPage=0;showTutorialPage()};$('#nextPage').onclick=()=>{tutorialPage=1;showTutorialPage()};$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=muted?'🔇':'🔊';if(muted){speechSynthesis?.cancel();stopRecognition()}};
</script></body></html>
