<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voice City</title>
<style>
:root{--navy:#16223d;--blue:#3977f6;--green:#27c88a;--red:#ef5f62;--gold:#ffd45f;--paper:#f7f4ec;--shadow:0 18px 42px #13203a2b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:#ddebf2;color:var(--navy);overflow-x:hidden}button{font:inherit}.hidden{display:none!important}
.shell{min-height:100vh;background:radial-gradient(circle at 10% 10%,#fff4bf 0 9%,transparent 24%),radial-gradient(circle at 90% 86%,#b8f1e0 0 11%,transparent 28%),linear-gradient(145deg,#f5f8ff,#e7f2ed);padding:clamp(12px,2vw,24px)}
.top{width:min(1200px,100%);margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px;height:58px}.logo{width:48px;height:48px;border:0;border-radius:16px;background:var(--navy);display:grid;place-items:center;color:white;font-size:26px;box-shadow:var(--shadow)}.round-logo{transform:rotate(-5deg)}.top-right{display:flex;align-items:center;gap:8px}.chip{height:44px;min-width:67px;border:0;border-radius:15px;background:#fff;display:flex;align-items:center;justify-content:center;gap:7px;font-size:20px;font-weight:900;box-shadow:0 8px 22px #13203a18}.small-version{font-size:10px;font-weight:900;color:#6b748a}
.setup{width:min(1120px,100%);margin:auto;min-height:calc(100vh - 90px);display:grid;place-items:center}.setup-card{width:min(760px,100%);border-radius:42px;background:#ffffffd9;backdrop-filter:blur(15px);box-shadow:var(--shadow);border:2px solid #fff;padding:clamp(22px,5vw,48px);text-align:center}.city-mark{font-size:clamp(80px,17vw,145px);filter:drop-shadow(0 16px 15px #2344aa28);animation:float 2.7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-10px)}}.stars{display:flex;justify-content:center;gap:12px;margin:26px 0}.star{width:clamp(72px,16vw,120px);height:78px;border:3px solid #e7eaf2;border-radius:22px;background:#fff;color:#c1c6d1;font-size:27px;cursor:pointer;transition:.2s}.star.active{border-color:var(--blue);color:var(--gold);background:#edf2ff;transform:translateY(-5px);box-shadow:0 12px 26px #3977f62b}.play{width:112px;height:112px;border:0;border-radius:50%;background:linear-gradient(145deg,var(--blue),#6e4cff);color:#fff;font-size:48px;cursor:pointer;box-shadow:0 20px 35px #4466db50;transition:.2s}.play:hover{transform:scale(1.05)}.sound-row{margin-top:24px;display:flex;justify-content:center;gap:12px}.round-choice{width:72px;height:50px;border:2px solid #e4e7ef;border-radius:16px;background:white;font-weight:950;font-size:19px;color:#8c94a7;cursor:pointer}.round-choice.active{border-color:var(--green);background:#e8fff6;color:#138e64}
.game{width:min(1220px,100%);margin:auto}.hud{display:grid;grid-template-columns:auto auto auto 1fr auto;gap:9px;align-items:center;margin:8px 0 14px}.icon-btn{width:48px;height:48px;border:0;border-radius:15px;background:#fff;font-size:22px;cursor:pointer;box-shadow:0 8px 22px #13203a18}.progress{height:10px;border-radius:99px;background:#cbd8df;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#59d5e3);border-radius:inherit;transition:.4s}.live{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#b7c3cc;color:#fff;font-size:22px;transition:.25s}.live.listening{background:var(--green);box-shadow:0 0 0 0 #27c88a88;animation:pulse 1.3s infinite}@keyframes pulse{70%{box-shadow:0 0 0 17px #27c88a00}}
.board-wrap{position:relative;background:#fff;padding:10px;border-radius:32px;box-shadow:var(--shadow);overflow:hidden}.city{position:relative;display:grid;grid-template-columns:1fr .34fr 1fr .34fr 1fr .34fr 1fr;grid-template-rows:1fr .38fr 1fr .38fr 1fr;gap:0;min-height:min(720px,calc(100vh - 150px));border-radius:24px;overflow:hidden;background:#b8d69e;perspective:900px}.lot{position:relative;border:0;min-width:0;background:linear-gradient(145deg,#c6e4ad,#a7cb8c);cursor:pointer;padding:4px;transition:.18s;overflow:visible}.lot:hover{filter:brightness(1.05)}.lot:active{transform:scale(.97)}.road-h,.road-v,.cross{position:relative;background:#697078}.road-h:after,.road-v:after{content:"";position:absolute;border-color:#e9ecef;border-style:dashed;opacity:.8}.road-h:after{inset:50% 0 auto;border-width:2px 0 0}.road-v:after{inset:0 auto 0 50%;border-width:0 0 0 2px}.cross:before,.cross:after{content:"";position:absolute;background:#697078}.cross:before{inset:0 36%}.cross:after{inset:36% 0}.place{position:absolute;left:50%;top:50%;width:min(68%,104px);aspect-ratio:1;transform:translate(-50%,-50%);display:grid;place-items:center;border-radius:clamp(10px,1.5vw,18px);background:linear-gradient(150deg,#fff,#e9eef5);box-shadow:inset 0 -7px 0 #cbd3de,0 9px 16px #31483338;border:2px solid #fff;transition:.25s}.place:before{content:"";position:absolute;inset:auto 11% -13% 11%;height:18%;border-radius:50%;background:#47603435;filter:blur(5px);z-index:-1}.emoji{font-size:clamp(30px,4.8vw,58px);line-height:1;filter:drop-shadow(0 6px 4px #0002)}.lot.correct .place{background:#bdf5dc;box-shadow:inset 0 -7px 0 #5fd3a4,0 0 0 8px #27c88a66}.lot.wrong .place{background:#ffd1cf;box-shadow:inset 0 -7px 0 #ef8585,0 0 0 8px #ef5f6260}.lot.focus .place{animation:focus 1.2s infinite}.front-car{position:absolute;z-index:8;right:3%;bottom:-19%;font-size:clamp(25px,3.8vw,45px);filter:drop-shadow(0 5px 3px #0005);cursor:pointer}@keyframes focus{50%{transform:translate(-50%,-58%);box-shadow:inset 0 -7px 0 #cbd3de,0 0 0 8px #ffd45f99}}
.feedback{position:absolute;z-index:10;left:50%;top:50%;translate:-50% -50%;width:clamp(95px,18vw,150px);height:clamp(95px,18vw,150px);border-radius:50%;display:grid;place-items:center;font-size:clamp(52px,10vw,92px);background:#fff;box-shadow:0 25px 70px #0005;animation:pop .35s ease-out}.feedback.good{background:#d9ffef}.feedback.bad{background:#ffe1df}@keyframes pop{from{transform:scale(.3) rotate(-15deg)}to{transform:scale(1)}}
.relation-dock{position:fixed;z-index:15;left:50%;bottom:max(12px,env(safe-area-inset-bottom));translate:-50% 0;display:flex;gap:7px;padding:9px;background:#16223ddd;border-radius:22px;box-shadow:0 15px 35px #0004;backdrop-filter:blur(10px)}.rel{width:51px;height:51px;border:0;border-radius:14px;background:#fff;color:var(--navy);font-size:25px;cursor:pointer}.rel:active{transform:scale(.9)}
.tutorial{position:fixed;inset:0;z-index:30;background:#10203be8;display:grid;place-items:center;padding:18px;backdrop-filter:blur(8px)}.tutorial-card{width:min(520px,100%);background:white;border-radius:34px;padding:28px;text-align:center}.demo{height:240px;border-radius:26px;background:#bdddac;display:grid;grid-template-columns:1fr .32fr 1fr;align-items:center;padding:18px}.demo-place{height:125px;border-radius:22px;background:white;display:grid;place-items:center;font-size:60px;box-shadow:inset 0 -8px #d9dee8}.demo-road{height:100%;background:#687079;position:relative}.demo-road:after{content:"";position:absolute;left:49%;top:0;bottom:0;border-left:2px dashed white}.waves{font-size:45px;margin:18px}.go{width:90px;height:90px;border:0;border-radius:50%;background:var(--green);color:white;font-size:40px;cursor:pointer;box-shadow:0 14px 30px #27c88a55}
.finish{position:fixed;inset:0;z-index:30;background:#10203be8;display:grid;place-items:center;padding:18px}.finish-card{width:min(500px,100%);background:white;border-radius:36px;padding:38px;text-align:center}.trophy{font-size:100px}.final-score{font-size:65px;font-weight:950;color:var(--blue);margin:10px}.finish-actions{display:flex;justify-content:center;gap:12px}.finish-actions button{width:80px;height:80px;border:0;border-radius:24px;font-size:35px;cursor:pointer;background:#edf1fb}
@media(max-width:680px){.shell{padding:8px}.top{height:52px}.city{min-height:calc(100vh - 124px)}.emoji{font-size:clamp(27px,8vw,46px)}.place{width:72%}.hud{grid-template-columns:auto auto auto 1fr auto;gap:5px}.chip{min-width:55px;height:42px}.icon-btn,.live{width:43px;height:43px}.relation-dock{max-width:96vw;overflow:auto}.rel{min-width:47px}}
</style>
</head>
<body>
<div class="shell">
 <header class="top">
  <button class="logo round-logo" id="home" aria-label="Home">🏙️</button>
  <div class="top-right"><div class="small-version">V2</div><button class="logo" id="sound" aria-label="Sound">🔊</button></div>
 </header>
 <section class="setup" id="setup">
  <div class="setup-card">
   <div class="city-mark">🏙️</div>
   <div class="stars" id="levels">
    <button class="star active" data-level="easy" aria-label="Easy">★</button>
    <button class="star" data-level="medium" aria-label="Medium">★★</button>
    <button class="star" data-level="hard" aria-label="Hard">★★★</button>
   </div>
   <button class="play" id="play" aria-label="Play">▶</button>
   <div class="sound-row" id="rounds">
    <button class="round-choice active" data-rounds="10" aria-label="10 rounds">10</button>
    <button class="round-choice" data-rounds="20" aria-label="20 rounds">20</button>
    <button class="round-choice" data-rounds="30" aria-label="30 rounds">30</button>
   </div>
  </div>
 </section>
 <section class="game hidden" id="game">
  <div class="hud">
   <button class="icon-btn" id="back" aria-label="Main menu">⌂</button>
   <div class="chip">🧩 <span id="roundNo">1</span></div>
   <div class="chip">⭐ <span id="score">0</span></div>
   <div class="progress"><i id="bar"></i></div>
   <button class="live" id="mic" aria-label="Microphone">🎙️</button>
  </div>
  <div class="board-wrap">
   <div class="city" id="city"></div>
   <div class="feedback hidden" id="feedback"></div>
  </div>
  <div class="relation-dock hidden" id="relationDock">
   <button class="rel" data-rel="across" aria-label="Across from">✥</button><button class="rel" data-rel="front" aria-label="In front of">🚗</button><button class="rel" data-rel="next" aria-label="Next to">↔</button><button class="rel" data-rel="left" aria-label="Left">←</button><button class="rel" data-rel="right" aria-label="Right">→</button><button class="rel" data-rel="between" aria-label="Between">⇔</button>
  </div>
 </section>
</div>
<div class="tutorial hidden" id="tutorial"><div class="tutorial-card"><div class="demo"><div class="demo-place">🏥</div><div class="demo-road"></div><div class="demo-place">🏦</div></div><div class="waves">🔊 → 🎙️</div><button class="go" id="tutorialGo" aria-label="Start">▶</button></div></div>
<div class="finish hidden" id="finish"><div class="finish-card"><div class="trophy">🏆</div><div class="final-score" id="finalScore">0</div><div class="finish-actions"><button id="again" aria-label="Play again">↻</button><button id="finishHome" aria-label="Home">⌂</button></div></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const PLACES=[
 ['hospital','🏥',['clinic','medical centre','medical center']],['bank','🏦',['money','money bank']],['school','🏫',['high school']],['police station','🚓',['police','police office']],['bus stop','🚏',['bus station']],['cinema','🎬',['movie theatre','movie theater','theatre','theater']],['metro station','🚇',['metro','subway','subway station']],['fire station','🚒',['fire department']],['library','📚',['bookshop']],['supermarket','🛒',['market','grocery store']],['restaurant','🍽️',['cafe','diner']],['pharmacy','💊',['drugstore']],['park','🌳',['garden']],['museum','🏛️',['gallery']],['hotel','🏨',['motel']],['airport','✈️',['air port']],['post office','📮',['post']],['stadium','🏟️',['sports centre','sports center']],['train station','🚉',['railway station']],['bakery','🥐',['bread shop']],['gym','🏋️',['fitness centre','fitness center']],['university','🎓',['college']],['shopping centre','🛍️',['shopping center','mall']],['petrol station','⛽',['gas station','fuel station']]
].map(([name,icon,aliases])=>({name,icon,aliases}));
const POS=[];for(let r=0;r<3;r++)for(let c=0;c<4;c++)POS.push({r,c});
const WORDS={across:['across from'],front:['in front of'],next:['next to'],left:['left'],right:['right'],between:['between']};
let level='easy',roundTotal=10,round=0,score=0,map=[],tasks=[],task=null,locked=false,muted=false,first=true,recognition=null,recognitionEpoch=0,retry=0,voiceWanted=false;
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$$('#levels .star').forEach(b=>b.onclick=()=>{$$('#levels .star').forEach(x=>x.classList.remove('active'));b.classList.add('active');level=b.dataset.level});
$$('#rounds .round-choice').forEach(b=>b.onclick=()=>{$$('#rounds .round-choice').forEach(x=>x.classList.remove('active'));b.classList.add('active');roundTotal=+b.dataset.rounds});
function speak(text,after,rate=.86){stopRecognition();if(muted||!('speechSynthesis'in window)){setTimeout(()=>after?.(),250);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate;u.pitch=1;u.onend=()=>after?.();u.onerror=()=>after?.();speechSynthesis.speak(u)}
function buildCity(){map=shuffle(PLACES).slice(0,12).map((p,i)=>({...p,...POS[i]}));const city=$('#city');city.innerHTML='';for(let gr=0;gr<5;gr++)for(let gc=0;gc<7;gc++){if(gr%2===0&&gc%2===0){const r=gr/2,c=gc/2,p=map.find(x=>x.r===r&&x.c===c),b=document.createElement('button');b.className='lot';b.dataset.name=p.name;b.style.gridRow=gr+1;b.style.gridColumn=gc+1;b.innerHTML=`<span class="place"><span class="emoji">${p.icon}</span></span>`;b.onclick=e=>e.target.closest('.front-car')?tapCar():tapPlace(p.name);city.append(b)}else{const d=document.createElement('div');d.style.gridRow=gr+1;d.style.gridColumn=gc+1;d.className=gr%2&&gc%2?'cross':gr%2?'road-h':'road-v';city.append(d)}}}
function at(r,c){return map.find(p=>p.r===r&&p.c===c)}
function acrossPlaces(p){return [[-1,0],[1,0],[0,-1],[0,1]].map(([dr,dc])=>at(p.r+dr,p.c+dc)).filter(Boolean)}
function validRelations(a,b){const out=[];const dr=a.r-b.r,dc=a.c-b.c;if(Math.abs(dr)+Math.abs(dc)===1)out.push('across');if(dr===0&&Math.abs(dc)===1)out.push('next');if(dr===0&&dc===-1)out.push('left');if(dr===0&&dc===1)out.push('right');return out}
function makeTasks(){const out=[];
 for(const reference of map){const across=acrossPlaces(reference);if(across.length)out.push({type:'place',answers:across.map(x=>x.name),rel:'across',a:across[0],b:reference,prompt:`What place is across from the ${reference.name}?`});const left=at(reference.r,reference.c-1),right=at(reference.r,reference.c+1);if(left)out.push({type:'place',answers:[left.name],rel:'left',a:left,b:reference,prompt:`What place is left of the ${reference.name}?`});if(right)out.push({type:'place',answers:[right.name],rel:'right',a:right,b:reference,prompt:`What place is right of the ${reference.name}?`});const next=[left,right].filter(Boolean);if(next.length)out.push({type:'place',answers:next.map(x=>x.name),rel:'next',a:next[0],b:reference,prompt:`What place is next to the ${reference.name}?`});for(const other of across){const rels=validRelations(other,reference);out.push({type:'relation',answers:rels,rel:rels[0],a:other,b:reference,prompt:`Where is the ${other.name} in relation to the ${reference.name}?`})}if(reference.r<2){out.push({type:'place',answerKind:'car',answers:['car'],rel:'front',a:reference,b:reference,prompt:`What is in front of the ${reference.name}?`});out.push({type:'relation',answerKind:'car',answers:['front'],rel:'front',a:reference,b:reference,prompt:`Where is the car in relation to the ${reference.name}?`})}}
 for(let r=0;r<3;r++)for(let c=1;c<3;c++){const left=at(r,c-1),mid=at(r,c),right=at(r,c+1);out.push({type:'place',answers:[mid.name],rel:'between',a:mid,b:left,c:right,prompt:`What place is between the ${left.name} and the ${right.name}?`});out.push({type:'relation',answers:['between'],rel:'between',a:mid,b:left,c:right,prompt:`Where is the ${mid.name} in relation to the ${left.name} and the ${right.name}?`})}
 return shuffle(out).slice(0,roundTotal)}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function startGame(){round=score=0;$('#score').textContent=0;$('#setup').classList.add('hidden');$('#finish').classList.add('hidden');$('#game').classList.remove('hidden');buildCity();tasks=makeTasks();if(first){first=false;$('#tutorial').classList.remove('hidden');speak('Listen to the question. Then answer by speaking. The city has pictures, but no written place names.')}else nextTask()}
function nextTask(){if(round>=roundTotal||!tasks[round])return finish();task=tasks[round];locked=false;retry=0;clearMarks();if(task.rel==='front'){const lot=$(`.lot[data-name="${task.b.name}"]`);lot?.insertAdjacentHTML('beforeend','<span class="front-car" role="button" aria-label="Car">🚗</span>');lot?.classList.add('focus')}$('#roundNo').textContent=round+1;$('#bar').style.width=`${round/roundTotal*100}%`;$('#relationDock').classList.toggle('hidden',task.type!=='relation');setTimeout(()=>ask(),350)}
function ask(rate=.86){if(!task)return;speak(task.prompt,()=>setTimeout(startRecognition,450),rate)}
function clearMarks(){$$('.front-car').forEach(x=>x.remove());$$('.lot').forEach(x=>x.classList.remove('correct','wrong','focus'));$('#feedback').className='feedback hidden'}
function normalize(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function containsPhrase(text,phrase){return (` ${normalize(text)} `).includes(` ${normalize(phrase)} `)}
function placeMatch(text,name){if(name==='car')return ['car','the car','vehicle'].some(x=>containsPhrase(text,x));const p=map.find(x=>x.name===name),answers=[p.name,...p.aliases];return answers.some(x=>containsPhrase(text,x))}
function relMatch(text,rel){return WORDS[rel].some(x=>containsPhrase(text,x))}
function allKnownPlace(text){if(containsPhrase(text,'car'))return{name:'car'};return map.find(p=>[p.name,...p.aliases].some(x=>containsPhrase(text,x)))}
function allKnownRel(text){return Object.keys(WORDS).find(r=>relMatch(text,r))}
function evaluate(heard){if(locked)return;const ok=task.type==='place'?heard.some(h=>task.answers.some(a=>placeMatch(h,a))):heard.some(h=>task.answers.some(a=>relMatch(h,a)));if(ok)return grade(true);const wrongKnown=task.type==='place'?heard.some(h=>allKnownPlace(h)):heard.some(h=>allKnownRel(h));if(wrongKnown)return grade(false);retry++;speak('Please say it again.',()=>setTimeout(startRecognition,450))}
function grade(ok){if(locked)return;locked=true;stopRecognition();const tile=$(`.lot[data-name="${task.a.name}"]`);tile?.classList.add(ok?'correct':'wrong');if(!ok&&task.type==='place'&&task.answerKind!=='car')task.answers.forEach(name=>$(`.lot[data-name="${name}"]`)?.classList.add('correct'));if(!ok&&task.answerKind==='car')$(`.lot[data-name="${task.b.name}"]`)?.classList.add('correct');$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=ok?'✓':'✕';if(ok){score++;$('#score').textContent=score;speak('Correct!',advance)}else{const answer=task.type==='place'?task.answers[0]:WORDS[task.answers[0]][0];speak(`One correct answer is ${answer}.`,advance)}}
function advance(){setTimeout(()=>{round++;nextTask()},850)}
function tapPlace(name){if(locked||!task||task.type!=='place'||task.answerKind==='car')return;grade(task.answers.includes(name))}
function tapCar(){if(locked||!task||task.type!=='place'||task.answerKind!=='car')return;grade(true)}
function tapRelation(rel){if(locked||!task||task.type!=='relation')return;grade(task.answers.includes(rel))}
function startRecognition(){if(locked||!task)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;voiceWanted=true;if(!SR){$('#mic').classList.add('listening');return}stopRecognition(false);voiceWanted=true;const token=++recognitionEpoch,r=new SR();recognition=r;r.lang='en-US';r.interimResults=false;r.continuous=false;r.maxAlternatives=5;r.onstart=()=>{if(token===recognitionEpoch)$('#mic').classList.add('listening')};r.onresult=e=>{if(token!==recognitionEpoch)return;voiceWanted=false;const heard=[...e.results[0]].map(x=>x.transcript);evaluate(heard)};r.onerror=e=>{if(token!==recognitionEpoch)return;if(e.error==='not-allowed'||e.error==='service-not-allowed'){voiceWanted=false;$('#mic').classList.remove('listening')}};r.onend=()=>{if(token!==recognitionEpoch)return;recognition=null;$('#mic').classList.remove('listening');if(voiceWanted&&!locked&&task)setTimeout(startRecognition,120)};try{r.start()}catch{recognition=null;if(voiceWanted&&!locked)setTimeout(startRecognition,180)}}
function stopRecognition(disable=true){if(disable)voiceWanted=false;recognitionEpoch++;try{recognition?.abort()}catch{}recognition=null;$('#mic').classList.remove('listening')}
function finish(){stopRecognition();speechSynthesis?.cancel();$('#bar').style.width='100%';$('#finalScore').textContent=`${score}/${roundTotal}`;$('#finish').classList.remove('hidden');speak(score/roundTotal>=.8?'Excellent work!':'Good work!')}
function goHome(){stopRecognition();speechSynthesis?.cancel();$('#game').classList.add('hidden');$('#finish').classList.add('hidden');$('#tutorial').classList.add('hidden');$('#setup').classList.remove('hidden')}
$('#play').onclick=startGame;$('#tutorialGo').onclick=()=>{$('#tutorial').classList.add('hidden');nextTask()};$('#again').onclick=startGame;$('#back').onclick=goHome;$('#finishHome').onclick=goHome;$('#home').onclick=goHome;$('#mic').onclick=()=>task&&ask();$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=muted?'🔇':'🔊';if(muted){speechSynthesis?.cancel();stopRecognition()}};$$('.rel').forEach(b=>b.onclick=()=>tapRelation(b.dataset.rel));
</script>
</body>
</html>
