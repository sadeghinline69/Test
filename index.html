<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Voice Street</title>
<style>
:root{--navy:#15223d;--blue:#3977f6;--green:#24c889;--red:#ef5d62;--gold:#ffd45e;--shadow:0 18px 42px #13203a2a}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:#e8f1f5;color:var(--navy)}button{font:inherit}.hidden{display:none!important}.shell{min-height:100vh;padding:clamp(9px,2vw,22px);background:radial-gradient(circle at 7% 7%,#fff2b8 0 8%,transparent 22%),radial-gradient(circle at 92% 90%,#b8f3df 0 9%,transparent 25%),linear-gradient(145deg,#f7f9ff,#e9f3ee)}
.top{width:min(1180px,100%);margin:auto;height:55px;display:flex;align-items:center;justify-content:space-between}.round-btn{width:46px;height:46px;border:0;border-radius:15px;background:#fff;display:grid;place-items:center;font-size:23px;box-shadow:0 8px 22px #13203a18;cursor:pointer}.top-right{display:flex;gap:8px;align-items:center}.version{font-size:10px;font-weight:900;color:#738096}.setup{min-height:calc(100vh - 75px);display:grid;place-items:center}.setup-card{width:min(700px,100%);padding:clamp(25px,5vw,48px);border-radius:40px;background:#ffffffdc;border:2px solid white;box-shadow:var(--shadow);text-align:center}.citymark{font-size:clamp(80px,18vw,145px);filter:drop-shadow(0 15px 13px #27449228)}.levels,.rounds{display:flex;justify-content:center;gap:10px;margin:24px 0}.level{width:clamp(74px,16vw,115px);height:70px;border:3px solid #e4e8f0;border-radius:21px;background:white;color:#c3c8d2;font-size:25px;cursor:pointer}.level.active{border-color:var(--blue);background:#eef2ff;color:var(--gold);transform:translateY(-4px)}.round{width:70px;height:48px;border:2px solid #e4e8f0;border-radius:15px;background:white;color:#8b94a6;font-size:18px;font-weight:950;cursor:pointer}.round.active{border-color:var(--green);background:#e8fff6;color:#138e64}.play{width:105px;height:105px;border:0;border-radius:50%;background:linear-gradient(145deg,var(--blue),#6c4eff);color:white;font-size:46px;box-shadow:0 19px 35px #445fdb50;cursor:pointer}
.game{width:min(1180px,100%);margin:auto}.hud{display:grid;grid-template-columns:auto auto auto 1fr auto auto;gap:8px;align-items:center;margin:8px 0 12px}.chip{height:44px;min-width:62px;border-radius:14px;background:white;display:flex;align-items:center;justify-content:center;gap:6px;font-size:18px;font-weight:950;box-shadow:0 7px 20px #13203a15}.progress{height:10px;border-radius:99px;background:#ccd9df;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#55d5e3);transition:.35s}.mic{width:46px;height:46px;border:0;border-radius:50%;background:#b8c3cb;color:white;font-size:21px;display:grid;place-items:center;cursor:pointer}.mic.listening{background:var(--green);animation:pulse 1.25s infinite}@keyframes pulse{70%{box-shadow:0 0 0 16px #24c88900}0%{box-shadow:0 0 0 0 #24c88988}}
.scene{position:relative;min-height:min(710px,calc(100vh - 135px));overflow:hidden;border:9px solid white;border-radius:30px;background:linear-gradient(#9bd9f3 0 30%,#b7d68f 30% 100%);box-shadow:var(--shadow)}.cloud{position:absolute;font-size:clamp(34px,6vw,66px);opacity:.8}.cloud.c1{left:7%;top:3%}.cloud.c2{right:11%;top:8%}.street{position:absolute;z-index:2;left:0;right:0;top:47%;height:25%;background:#626a73;border-top:10px solid #d9d5c8;border-bottom:10px solid #d9d5c8}.street:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:4px dashed #f7f1ca}.buildings{position:absolute;z-index:3;left:2%;right:2%;display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:clamp(8px,2vw,25px)}.buildings.north{top:18%;height:30%}.buildings.south{top:70%;height:28%;align-items:start}.slot{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}.south .slot{align-items:flex-start}.building{position:relative;width:min(72%,145px);aspect-ratio:1;border:0;border-radius:18px;background:linear-gradient(150deg,#fff,#e9edf4);box-shadow:inset 0 -8px #cbd2dc,0 11px 20px #243c3035;border:2px solid white;display:grid;place-items:center;cursor:pointer;z-index:3}.building .emoji{font-size:clamp(40px,6vw,70px);filter:drop-shadow(0 5px 4px #0002)}.building.back{position:absolute;width:min(54%,105px);z-index:1;filter:saturate(.85) brightness(.95);transform:translate(28%,-36%) scale(.88)}.south .building.back{transform:translate(-28%,36%) scale(.88)}.building.correct{background:#c4f5dd;box-shadow:inset 0 -8px #64d1a5,0 0 0 7px #24c88966}.building.wrong{background:#ffd0cf;box-shadow:inset 0 -8px #ef8586,0 0 0 7px #ef5d6260}.street-item{position:absolute;z-index:6;font-size:clamp(28px,4.5vw,53px);filter:drop-shadow(0 5px 4px #0005);cursor:pointer;translate:-50% -50%;border:0;background:transparent}.street-item.correct{filter:drop-shadow(0 0 10px #27f2a5) drop-shadow(0 0 4px white)}.street-item.wrong{filter:drop-shadow(0 0 10px #ff5757) drop-shadow(0 0 4px white)}
.judge{position:fixed;z-index:18;left:50%;bottom:max(12px,env(safe-area-inset-bottom));translate:-50% 0;display:flex;gap:14px;padding:9px;border-radius:24px;background:#15223dda;backdrop-filter:blur(10px);box-shadow:0 16px 34px #0004}.judge button{width:78px;height:60px;border:0;border-radius:17px;color:white;font-size:29px;font-weight:950;cursor:pointer}.judge .wrong-btn{background:var(--red)}.judge .correct-btn{background:var(--green)}.feedback{position:absolute;z-index:20;left:50%;top:50%;translate:-50% -50%;width:125px;height:125px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:76px;box-shadow:0 25px 65px #0005;animation:pop .3s}.feedback.good{background:#d8ffed}.feedback.bad{background:#ffe0df}@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.overlay{position:fixed;inset:0;z-index:30;background:#11203de9;display:grid;place-items:center;padding:15px;backdrop-filter:blur(9px)}.modal{width:min(650px,100%);max-height:92vh;overflow:auto;background:white;border-radius:33px;padding:clamp(20px,4vw,34px);text-align:center}.tutorial-head{display:flex;align-items:center;justify-content:space-between}.dots{display:flex;gap:7px}.dot{width:12px;height:12px;border-radius:50%;background:#d7dce6}.dot.active{background:var(--blue)}.close{width:42px;height:42px;border:0;border-radius:13px;background:#eef1f7;font-size:21px}.tutorial-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin:22px 0}.tutorial-place,.direction-card{border:0;border-radius:18px;background:#f2f5fb;min-height:115px;display:grid;place-items:center;font-size:52px;cursor:pointer}.tutorial-place:active,.direction-card:active{transform:scale(.96)}.direction-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin:22px 0}.direction-card{font-size:37px;position:relative}.direction-card small{font-size:13px;font-weight:900;color:#5e6980}.page-actions{display:flex;justify-content:center;gap:12px}.page-actions button{width:72px;height:54px;border:0;border-radius:16px;background:var(--blue);color:white;font-size:26px}.finish-card{width:min(470px,100%);background:white;border-radius:34px;padding:35px;text-align:center}.trophy{font-size:92px}.final-score{font-size:60px;color:var(--blue);font-weight:950}.finish-actions{display:flex;justify-content:center;gap:12px;margin-top:18px}.finish-actions button{width:76px;height:70px;border:0;border-radius:21px;background:#edf1f8;font-size:32px}
@media(max-width:650px){.shell{padding:7px}.top{height:49px}.scene{min-height:calc(100vh - 112px)}.hud{grid-template-columns:auto auto auto 1fr auto auto;gap:4px}.round-btn,.mic{width:41px;height:41px}.chip{height:40px;min-width:52px;font-size:15px}.building{width:78%;border-radius:13px}.building .emoji{font-size:clamp(34px,10vw,55px)}.building.back{width:61%}.tutorial-grid{grid-template-columns:repeat(2,1fr)}.judge button{width:70px;height:55px}}
</style></head><body>
<div class="shell"><header class="top"><button class="round-btn" id="home">🏙️</button><div class="top-right"><span class="version">V3</span><button class="round-btn" id="sound">🔊</button></div></header>
<section class="setup" id="setup"><div class="setup-card"><div class="citymark">🛣️</div><div class="levels" id="levels"><button class="level active" data-level="easy">★</button><button class="level" data-level="medium">★★</button><button class="level" data-level="hard">★★★</button></div><button class="play" id="play">▶</button><div class="rounds" id="rounds"><button class="round active" data-rounds="10">10</button><button class="round" data-rounds="20">20</button><button class="round" data-rounds="30">30</button></div></div></section>
<section class="game hidden" id="game"><div class="hud"><button class="round-btn" id="back">⌂</button><div class="chip">🧩 <span id="roundNo">1</span></div><div class="chip">⭐ <span id="score">0</span></div><div class="progress"><i id="bar"></i></div><button class="round-btn" id="tutorialBtn">?</button><button class="mic" id="mic">🎙️</button></div><div class="scene" id="scene"><span class="cloud c1">☁️</span><span class="cloud c2">☁️</span><div class="buildings north" id="north"></div><div class="street"></div><div class="buildings south" id="south"></div><div class="feedback hidden" id="feedback"></div></div><div class="judge"><button class="wrong-btn" id="manualWrong">✕</button><button class="correct-btn" id="manualCorrect">✓</button></div></section></div>
<div class="overlay hidden" id="tutorial"><div class="modal"><div class="tutorial-head"><div class="dots"><i class="dot active"></i><i class="dot"></i></div><button class="close" id="closeTutorial">✕</button></div><div id="placesPage"><div class="tutorial-grid" id="tutorialPlaces"></div></div><div class="hidden" id="directionsPage"><div class="direction-grid" id="directionGrid"></div></div><div class="page-actions"><button id="prevPage">←</button><button id="nextPage">→</button></div></div></div>
<div class="overlay hidden" id="finish"><div class="finish-card"><div class="trophy">🏆</div><div class="final-score" id="finalScore">0</div><div class="finish-actions"><button id="again">↻</button><button id="finishHome">⌂</button></div></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const PLACES=[['hospital','🏥',['clinic']],['bank','🏦',['money bank']],['school','🏫',['high school']],['police station','🚓',['police','police office']],['bus stop','🚏',['bus station']],['cinema','🎬',['movie theater','movie theatre']],['metro station','🚇',['metro','subway station']],['fire station','🚒',['fire department']],['library','📚',['bookshop']],['supermarket','🛒',['market','grocery store']],['restaurant','🍽️',['cafe']],['pharmacy','💊',['drugstore']],['park','🌳',['garden']],['museum','🏛️',['gallery']],['hotel','🏨',['motel']],['airport','✈️',['air port']],['post office','📮',['post']],['stadium','🏟️',['sports center']],['train station','🚉',['railway station']],['bakery','🥐',['bread shop']],['gym','🏋️',['fitness center']],['university','🎓',['college']],['shopping center','🛍️',['mall']],['petrol station','⛽',['gas station']]].map(([name,icon,aliases])=>({name,icon,aliases}));
const STREET_OBJECTS=[['car','🚗',['vehicle']],['person','🚶',['man','woman','pedestrian']],['motorcycle','🏍️',['motorbike']],['bicycle','🚲',['bike']],['bus','🚌',[]],['taxi','🚕',['cab']]];const RELATIONS=['across from','in front of','behind','next to','left','right','between'];
let level='easy',roundTotal=10,round=0,score=0,places=[],streetObjects=[],facts=[],tasks=[],task=null,locked=false,muted=false,recognition=null,recognitionEpoch=0,voiceWanted=false,retry=0,tutorialPage=0,resumeAfterTutorial=false;
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}const pick=a=>a[Math.floor(Math.random()*a.length)];
$$('#levels .level').forEach(b=>b.onclick=()=>{$$('#levels .level').forEach(x=>x.classList.remove('active'));b.classList.add('active');level=b.dataset.level});$$('#rounds .round').forEach(b=>b.onclick=()=>{$$('#rounds .round').forEach(x=>x.classList.remove('active'));b.classList.add('active');roundTotal=+b.dataset.rounds});
function buildScene(){const count=level==='easy'?4:level==='medium'?5:6,chosen=shuffle(PLACES).slice(0,count);if(level==='easy')places=[{...chosen[0],side:'north',slot:0},{...chosen[1],side:'north',slot:1},{...chosen[2],side:'south',slot:0},{...chosen[3],side:'south',slot:0,back:true}];else if(level==='medium')places=[{...chosen[0],side:'north',slot:0},{...chosen[1],side:'north',slot:1},{...chosen[2],side:'north',slot:2},{...chosen[3],side:'south',slot:1},{...chosen[4],side:'south',slot:1,back:true}];else places=[{...chosen[0],side:'north',slot:0},{...chosen[1],side:'north',slot:1},{...chosen[2],side:'north',slot:2},{...chosen[3],side:'south',slot:0},{...chosen[4],side:'south',slot:1},{...chosen[5],side:'south',slot:1,back:true}];renderSide('north');renderSide('south');const objectCount=level==='easy'?2:3,mains=places.filter(p=>!p.back);streetObjects=shuffle(STREET_OBJECTS).slice(0,objectCount).map((o,i)=>({name:o[0],icon:o[1],aliases:o[2],x:objectCount===2?[30,70][i]:[20,50,80][i],near:mains[i%mains.length]}));renderStreetObjects();buildFacts();buildTutorial()}
function renderSide(side){const root=$('#'+side);root.innerHTML='';for(let slot=0;slot<3;slot++){const wrap=document.createElement('div');wrap.className='slot';places.filter(p=>p.side===side&&p.slot===slot).sort((a,b)=>b.back-a.back).forEach(p=>{const b=document.createElement('button');b.className='building'+(p.back?' back':'');b.dataset.name=p.name;b.innerHTML=`<span class="emoji">${p.icon}</span>`;b.onclick=()=>manualEntity(p.name);wrap.append(b)});root.append(wrap)}}
function renderStreetObjects(){$$('.street-item').forEach(x=>x.remove());streetObjects.forEach((o,i)=>{const b=document.createElement('button');b.className='street-item';b.dataset.name=o.name;b.style.left=o.x+'%';b.style.top=(i%2?55:61)+'%';b.textContent=o.icon;b.onclick=()=>manualEntity(o.name);$('#scene').append(b)})}
function sentence(subject,relation,targets){if(relation==='between')return `The ${subject} is between the ${targets[0]} and the ${targets[1]}.`;return `The ${subject} is ${relation} the ${targets[0]}.`}function addFact(subject,relation,targets,kind='place'){facts.push({subject,relation,targets,kind,sentence:sentence(subject,relation,targets)})}
function buildFacts(){facts=[];const mains=places.filter(p=>!p.back);for(const side of ['north','south']){const row=mains.filter(p=>p.side===side).sort((a,b)=>a.slot-b.slot);for(let i=0;i<row.length-1;i++){addFact(row[i].name,'left',[row[i+1].name]);addFact(row[i+1].name,'right',[row[i].name]);addFact(row[i].name,'next to',[row[i+1].name]);addFact(row[i+1].name,'next to',[row[i].name])}if(row.length===3)addFact(row[1].name,'between',[row[0].name,row[2].name])}for(let slot=0;slot<3;slot++){const n=mains.find(p=>p.side==='north'&&p.slot===slot),s=mains.find(p=>p.side==='south'&&p.slot===slot);if(n&&s){addFact(n.name,'across from',[s.name]);addFact(s.name,'across from',[n.name])}}const back=places.find(p=>p.back),front=places.find(p=>!p.back&&p.side===back.side&&p.slot===back.slot);addFact(back.name,'behind',[front.name]);streetObjects.forEach(o=>addFact(o.name,'in front of',[o.near.name],'object'));tasks=[];for(const f of facts){tasks.push({mode:'name',fact:f,prompt:f.relation==='between'?`What is between the ${f.targets[0]} and the ${f.targets[1]}?`:`What is ${f.relation} the ${f.targets[0]}?`,answers:[f.subject]});tasks.push({mode:'relation',fact:f,prompt:f.relation==='between'?`Where is the ${f.subject} in relation to the ${f.targets[0]} and the ${f.targets[1]}?`:`Where is the ${f.subject} in relation to the ${f.targets[0]}?`,answers:[f.relation]})}tasks=shuffle(tasks);while(tasks.length<roundTotal)tasks.push(...shuffle(tasks.slice()));tasks=tasks.slice(0,roundTotal)}
function buildTutorial(){$('#tutorialPlaces').innerHTML=places.map(p=>`<button class="tutorial-place" data-name="${p.name}">${p.icon}</button>`).join('')+streetObjects.map(o=>`<button class="tutorial-place" data-name="${o.name}">${o.icon}</button>`).join('');$$('.tutorial-place').forEach(b=>b.onclick=()=>speak(b.dataset.name));const examples=[];for(const rel of RELATIONS){const f=facts.find(x=>x.relation===rel);if(f)examples.push(f)}$('#directionGrid').innerHTML=examples.map(f=>`<button class="direction-card" data-sentence="${f.sentence}"><span>${relationIcon(f.relation)}</span><small>${f.relation}</small></button>`).join('');$$('.direction-card').forEach(b=>b.onclick=()=>speak(b.dataset.sentence))}
function relationIcon(r){return({'across from':'🏫 🛣️ 🏦','in front of':'🏫 🚗','behind':'🏦 ◀ 🏫','next to':'🏫 ↔ 🏥','left':'🏫 ← 🏥','right':'🏫 → 🏥','between':'🏦 🏫 🏥'})[r]}
function startGame(){round=score=0;$('#score').textContent=0;$('#setup').classList.add('hidden');$('#finish').classList.add('hidden');$('#game').classList.remove('hidden');buildScene();nextTask()}function nextTask(){if(round>=roundTotal)return finishGame();task=tasks[round];locked=false;retry=0;clearMarks();$('#roundNo').textContent=round+1;$('#bar').style.width=(round/roundTotal*100)+'%';setTimeout(ask,350)}function ask(){speak(task.prompt,()=>setTimeout(startRecognition,350))}
function normalize(s){return s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}function contains(t,p){return (` ${normalize(t)} `).includes(` ${normalize(p)} `)}function entity(name){return places.find(p=>p.name===name)||streetObjects.find(o=>o.name===name)}function answerMatch(text){if(task.mode==='relation')return task.answers.some(a=>contains(text,a));return task.answers.some(name=>{const e=entity(name);return[e.name,...e.aliases].some(a=>contains(text,a))})}function knownWrong(text){if(task.mode==='relation')return RELATIONS.some(r=>contains(text,r));return[...places,...streetObjects].some(e=>[e.name,...e.aliases].some(a=>contains(text,a)))}
function evaluate(heard){if(locked)return;if(heard.some(answerMatch))return grade(true);if(heard.some(knownWrong))return grade(false);retry++;if(retry<2)speak('Please say it again.',()=>setTimeout(startRecognition,500));else grade(false)}function manualEntity(name){if(locked||task.mode!=='name')return;grade(task.answers.includes(name))}function mark(ok){const e=entity(task.fact.subject),el=$(`[data-name="${e.name}"]`);el?.classList.add(ok?'correct':'wrong')}function grade(ok){if(locked)return;locked=true;stopRecognition();mark(ok);$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=ok?'✓':'✕';if(ok){score++;$('#score').textContent=score}speak((ok?'Correct. ':'Wrong. ')+task.fact.sentence,()=>setTimeout(()=>{round++;nextTask()},650))}function clearMarks(){$$('.building,.street-item').forEach(x=>x.classList.remove('correct','wrong'));$('#feedback').className='feedback hidden'}
function speak(text,after){stopRecognition();if(muted||!('speechSynthesis'in window)){setTimeout(()=>after?.(),180);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;u.onend=()=>after?.();u.onerror=()=>after?.();speechSynthesis.speak(u)}
function startRecognition(){if(locked||!task)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;voiceWanted=true;if(!SR){$('#mic').classList.add('listening');return}stopRecognition(false);voiceWanted=true;const token=++recognitionEpoch,r=new SR();recognition=r;r.lang='en-US';r.continuous=false;r.interimResults=false;r.maxAlternatives=5;r.onstart=()=>token===recognitionEpoch&&$('#mic').classList.add('listening');r.onresult=e=>{if(token!==recognitionEpoch)return;voiceWanted=false;evaluate([...e.results[0]].map(x=>x.transcript))};r.onerror=e=>{if(token!==recognitionEpoch)return;if(['not-allowed','service-not-allowed'].includes(e.error))voiceWanted=false};r.onend=()=>{if(token!==recognitionEpoch)return;recognition=null;$('#mic').classList.remove('listening');if(voiceWanted&&!locked)setTimeout(startRecognition,100)};try{r.start()}catch{recognition=null;if(voiceWanted&&!locked)setTimeout(startRecognition,160)}}function stopRecognition(disable=true){if(disable)voiceWanted=false;recognitionEpoch++;try{recognition?.abort()}catch{}recognition=null;$('#mic').classList.remove('listening')}
function openTutorial(){resumeAfterTutorial=!locked;stopRecognition();speechSynthesis?.cancel();tutorialPage=0;showTutorialPage();$('#tutorial').classList.remove('hidden')}function showTutorialPage(){$('#placesPage').classList.toggle('hidden',tutorialPage!==0);$('#directionsPage').classList.toggle('hidden',tutorialPage!==1);$$('.dot').forEach((d,i)=>d.classList.toggle('active',i===tutorialPage));$('#prevPage').disabled=tutorialPage===0;$('#nextPage').disabled=tutorialPage===1}function closeTutorial(){speechSynthesis?.cancel();$('#tutorial').classList.add('hidden');if(resumeAfterTutorial)setTimeout(ask,250)}function finishGame(){stopRecognition();speechSynthesis?.cancel();$('#bar').style.width='100%';$('#finalScore').textContent=`${score}/${roundTotal}`;$('#finish').classList.remove('hidden')}function goHome(){stopRecognition();speechSynthesis?.cancel();$('#game').classList.add('hidden');$('#finish').classList.add('hidden');$('#tutorial').classList.add('hidden');$('#setup').classList.remove('hidden')}
$('#play').onclick=startGame;$('#again').onclick=startGame;$('#back').onclick=goHome;$('#home').onclick=goHome;$('#finishHome').onclick=goHome;$('#mic').onclick=ask;$('#manualCorrect').onclick=()=>grade(true);$('#manualWrong').onclick=()=>grade(false);$('#tutorialBtn').onclick=openTutorial;$('#closeTutorial').onclick=closeTutorial;$('#prevPage').onclick=()=>{tutorialPage=0;showTutorialPage()};$('#nextPage').onclick=()=>{tutorialPage=1;showTutorialPage()};$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=muted?'🔇':'🔊';if(muted){speechSynthesis?.cancel();stopRecognition()}};
</script></body></html>
