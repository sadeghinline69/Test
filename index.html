<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secret Mission — Preposition Quest</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f3f7ff;background:#0a1024}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,#27366c,#0a1024 60%);min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible,.item:focus-visible{outline:3px solid #ffdf6b;outline-offset:3px}.shell{max-width:1150px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900;font-size:clamp(22px,4vw,34px);letter-spacing:.5px}.brand span{color:#6debd2}.pill{border:1px solid #56669c;background:#1b2851;border-radius:99px;padding:9px 15px}.stats{display:flex;gap:9px;flex-wrap:wrap}.panel{background:#131d3d;border:1px solid #394b80;border-radius:24px;padding:22px;box-shadow:0 18px 55px #0004;margin-top:20px}.intro{max-width:720px;margin:60px auto;text-align:center}.intro h1{font-size:clamp(34px,6vw,58px);margin:0}.intro p{color:#bdc9eb;line-height:1.7}.btn{border:0;border-radius:14px;background:#6debd2;color:#0a1831;font-weight:850;padding:13px 20px}.btn.secondary{background:#2d3c70;color:white}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.mission{font-size:clamp(18px,2.6vw,26px);font-weight:750;margin:12px 0}.muted{color:#b7c6e8}.scene{position:relative;width:100%;height:clamp(330px,47vw,500px);border-radius:19px;overflow:hidden;border:3px solid #536c9d;background:linear-gradient(#415d91 0 69%,#a87e68 69% 100%);isolation:isolate}.scene.lab{background:linear-gradient(#33566a 0 69%,#677c80 69%)}.scene.city{background:linear-gradient(#78b9da 0 68%,#8e9ba4 68%)}.scene.museum{background:linear-gradient(#5b456e 0 69%,#aa8a77 69%)}.wallstripe{position:absolute;inset:65% 0 auto;height:3%;background:#ffffff23}.decor{position:absolute;pointer-events:none;user-select:none}.item{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #ffffff55;border-radius:15px;background:#17284bba;color:white;min-width:70px;min-height:65px;padding:7px;transition:transform .15s,background .15s;box-shadow:0 5px 12px #0005;touch-action:none}.item:hover{transform:scale(1.07);background:#344c86}.item .emoji{font-size:clamp(27px,4vw,43px)}.item .name{font-size:12px;font-weight:700;text-shadow:0 1px #000}.item.correct{background:#12876f;border-color:#a3ffe8}.item.wrong{background:#a83c62;border-color:#ffd0d8}.hint{padding:12px 15px;border-radius:12px;background:#273961;margin:12px 0;min-height:48px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:14px 0}.progress{height:9px;background:#2a3b68;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#6debd2;transition:width .2s}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.legend{font-size:13px;color:#bdc9eb}.voice{background:#dc5c89;color:#fff}.drop{outline:3px dashed #ffe08c!important}.end{text-align:center;padding:30px}.end h2{font-size:38px}.mini{font-size:13px}.difficulty{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:20px 0}.difficulty button.active{background:#6debd2;color:#0a1831}.confetti{font-size:54px}@media(max-width:600px){.shell{padding:10px}.panel{padding:14px}.item{min-width:58px;min-height:58px;padding:4px}.item .name{font-size:10px}.scene{height:380px}.brand{font-size:24px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">🕵️ <span>SECRET</span> MISSION</div><div class="stats"><span class="pill" id="levelStat">Mission 0/20</span><span class="pill" id="scoreStat">⭐ 0 points</span><span class="pill" id="lifeStat">❤️❤️❤️</span></div></header><div id="app"></div></main><script>
'use strict';const app=document.getElementById('app');let stage=0,score=0,lives=3,locked=false,mode='normal',attempts=0,recognition=null,dragged=null;
const scenes={room:{name:'Agent Headquarters',cls:'',decor:[['🪟',14,9,65],['🖼️',73,12,49],['🪴',91,57,42]]},lab:{name:'Science Laboratory',cls:'lab',decor:[['⚗️',14,13,45],['🧪',81,12,47],['🔬',50,8,49]]},city:{name:'City Investigation',cls:'city',decor:[['☁️',12,9,55],['☁️',72,8,58],['🌳',88,42,67]]},museum:{name:'Mystery Museum',cls:'museum',decor:[['🖼️',12,11,62],['🏛️',50,8,52],['🖼️',84,12,62]]}};
// Each mission uses a fixed scene composition. The position relation is encoded in the clue and visual layout.
const missions=[
['room','under','Find the key UNDER the table.','key',[['Table','🪑',45,47],['Key','🗝️',45,78],['Book','📕',17,55],['Lamp','💡',77,39],['Chair','🪑',72,75]]],
['room','on','Find the book ON the desk.','book',[['Desk','🗄️',49,57],['Book','📘',49,40],['Ball','⚽',17,76],['Cup','☕',82,53],['Bag','🎒',80,79]]],
['room','between','Find the ball BETWEEN the two chairs.','ball',[['Chair A','🪑',20,65],['Ball','⚽',49,67],['Chair B','🪑',78,65],['Lamp','💡',12,28],['Bag','🎒',85,29]]],
['room','behind','Find the cat BEHIND the sofa.','cat',[['Cat','🐈',49,52],['Sofa','🛋️',49,68],['Book','📗',17,74],['Clock','⏰',79,28],['Plant','🪴',83,76]]],
['room','in','Find the apple IN the box.','apple',[['Box','📦',48,67],['Apple','🍎',48,66],['Cup','🥤',18,49],['Ball','🏀',78,73],['Book','📙',80,40]]],
['lab','above','Find the light ABOVE the computer.','light',[['Computer','💻',49,65],['Light','💡',49,24],['Bottle','🧴',16,74],['Robot','🤖',80,67],['Book','📚',80,35]]],
['lab','next to','Find the battery NEXT TO the robot.','battery',[['Robot','🤖',42,67],['Battery','🔋',64,67],['Key','🗝️',15,72],['Screen','🖥️',49,30],['Cup','☕',82,33]]],
['lab','in front of','Find the camera IN FRONT OF the screen.','camera',[['Screen','🖥️',50,39],['Camera','📷',50,72],['Bottle','🧴',17,67],['Robot','🤖',82,66],['Key','🗝️',80,31]]],
['lab','below','Find the folder BELOW the clock.','folder',[['Clock','🕒',51,24],['Folder','📁',51,71],['Phone','📱',16,72],['Cup','☕',81,65],['Book','📗',81,31]]],
['lab','inside','Find the gem INSIDE the safe.','gem',[['Safe','🔐',48,66],['Gem','💎',48,66],['Camera','📷',16,68],['Key','🗝️',82,65],['Robot','🤖',79,31]]],
['city','across from','Find the café ACROSS FROM the bank.','cafe',[['Bank','🏦',23,42],['Café','☕',76,42],['Bus','🚌',48,75],['Tree','🌳',14,78],['School','🏫',79,78]]],
['city','beside','Find the bike BESIDE the bus.','bike',[['Bus','🚌',48,68],['Bike','🚲',72,68],['Car','🚗',19,71],['House','🏠',18,31],['Shop','🏪',81,31]]],
['city','opposite','Find the hospital OPPOSITE the school.','hospital',[['School','🏫',20,38],['Hospital','🏥',79,38],['Car','🚙',48,72],['Park','🌳',16,78],['Bus','🚌',82,78]]],
['city','near','Find the taxi NEAR the hotel.','taxi',[['Hotel','🏨',69,39],['Taxi','🚕',72,71],['Bus','🚌',15,76],['Bike','🚲',17,38],['Park','🌲',45,32]]],
['city','between','Find the shop BETWEEN the bank and the school.','shop',[['Bank','🏦',17,44],['Shop','🏪',50,44],['School','🏫',83,44],['Car','🚗',23,77],['Bus','🚌',77,77]]],
['museum','under','Find the scroll UNDER the painting.','scroll',[['Painting','🖼️',49,25],['Scroll','📜',49,75],['Gem','💎',17,69],['Statue','🗿',80,70],['Key','🗝️',81,30]]],
['museum','above','Find the crown ABOVE the statue.','crown',[['Statue','🗿',49,68],['Crown','👑',49,25],['Vase','🏺',18,72],['Gem','💎',80,71],['Book','📕',80,30]]],
['museum','behind','Find the map BEHIND the chest.','map',[['Map','🗺️',50,45],['Chest','🧰',50,70],['Gem','💎',18,70],['Crown','👑',81,30],['Vase','🏺',81,72]]],
['museum','between','Find the trophy BETWEEN the two statues.','trophy',[['Statue A','🗿',18,68],['Trophy','🏆',50,68],['Statue B','🗿',82,68],['Scroll','📜',18,29],['Crown','👑',81,29]]],
['museum','in front of','Find the final key IN FRONT OF the treasure chest.','key',[['Chest','🧰',50,46],['Key','🗝️',50,75],['Gem','💎',17,71],['Vase','🏺',80,72],['Crown','👑',79,27]]]
].map(([scene,prep,clue,target,items])=>({scene,prep,clue,target,items:items.map(([name,emoji,x,y])=>({name,emoji,x,y}))}));
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9 ]/g,'').trim().replace(/\s+/g,' ')}function update(){document.getElementById('levelStat').textContent=`Mission ${Math.min(stage+1,20)}/20`;document.getElementById('scoreStat').textContent=`⭐ ${score} points`;document.getElementById('lifeStat').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)}
function welcome(){update();app.innerHTML=`<section class="panel intro"><div style="font-size:70px">🕵️‍♀️🔎🗝️</div><h1>THE SECRET MISSION</h1><p>Twenty missions. Four mysterious locations. Find the hidden objects using English prepositions. <strong>Tap, drag, or speak</strong> your answer. Earn stars, unlock locations, and crack the final mystery!</p><div class="difficulty"><button class="btn secondary active" data-mode="normal">Agent · 3 lives</button><button class="btn secondary" data-mode="practice">Practice · unlimited lives</button></div><div class="actions"><button class="btn" id="start">START MISSION →</button></div><p class="mini">🎤 Voice works best in Chrome or Edge with microphone permission. Clicking always works.</p></section>`;app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;app.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b))});document.getElementById('start').onclick=()=>{stage=0;score=0;lives=3;render()}}
function render(){if(recognition){try{recognition.abort()}catch(e){}recognition=null}if(stage>=missions.length)return finish(true);if(lives<=0&&mode==='normal')return finish(false);locked=false;attempts=0;update();const m=missions[stage],s=scenes[m.scene];let decor=s.decor.map(([emoji,x,y,size])=>`<div class="decor" style="left:${x}%;top:${y}%;font-size:${size}px">${emoji}</div>`).join('');let objects=m.items.map((o,i)=>`<button class="item" data-index="${i}" style="left:${o.x}%;top:${o.y}%;transform:translate(-50%,-50%)" aria-label="${o.name}" title="${o.name}"><span class="emoji">${o.emoji}</span><span class="name">${o.name}</span></button>`).join('');app.innerHTML=`<section class="panel"><div class="top"><div><div class="muted">📍 ${s.name} · Level ${Math.floor(stage/5)+1} of 4</div><div class="mission">🎯 ${m.clue}</div></div><button class="btn secondary" id="repeat">🔊 Hear clue</button></div><div class="progress"><div style="width:${stage/20*100}%"></div></div><div class="scene ${s.cls}" id="scene" role="group" aria-label="Interactive ${s.name} scene"><div class="wallstripe"></div>${decor}${objects}</div><div class="toolbar"><button class="btn voice" id="mic">🎤 Speak answer</button><button class="btn secondary" id="hintBtn">💡 Hint (−5 pts)</button><button class="btn secondary" id="skip">Skip (−1 life)</button><span class="legend">Click an object, drag it onto the 🎯 target zone, or say “${m.items.find(x=>norm(x.name).startsWith(m.target)).name}”.</span></div><div class="hint" id="feedback" role="status" aria-live="polite">🕵️ Examine the scene carefully. Which object matches the clue?</div><div id="dropzone" style="border:2px dashed #6688b8;border-radius:12px;text-align:center;padding:12px;color:#c8dcff">🎯 Drag your chosen object here</div><div class="actions" style="margin-top:14px"><button class="btn" id="next" hidden>Next mission →</button></div></section>`;
app.querySelectorAll('.item').forEach(b=>{b.onclick=()=>answer(Number(b.dataset.index));b.draggable=true;b.addEventListener('dragstart',e=>{dragged=Number(b.dataset.index);e.dataTransfer.setData('text/plain',String(dragged))});b.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')dragged=Number(b.dataset.index)});b.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse'&&dragged!==null){const hit=document.elementFromPoint(e.clientX,e.clientY);if(hit&&hit.closest('#dropzone'))answer(dragged);dragged=null}})});let dz=document.getElementById('dropzone');dz.ondragover=e=>{e.preventDefault();dz.classList.add('drop')};dz.ondragleave=()=>dz.classList.remove('drop');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drop');answer(Number(e.dataTransfer.getData('text/plain')))};document.getElementById('repeat').onclick=()=>speak(m.clue);document.getElementById('mic').onclick=listen;document.getElementById('hintBtn').onclick=()=>{if(locked)return;score=Math.max(0,score-5);update();document.getElementById('feedback').textContent=`💡 Look for the object ${m.prep.toUpperCase()} the landmark in the clue. Read each object label carefully.`};document.getElementById('skip').onclick=()=>{if(locked)return;if(mode==='normal')lives--;stage++;render()};document.getElementById('next').onclick=()=>{stage++;render()}}
function answer(i){if(locked)return;const m=missions[stage],o=m.items[i];if(!o)return;let el=app.querySelector(`[data-index="${i}"]`);if(norm(o.name).startsWith(m.target)){locked=true;let gain=Math.max(5,20-attempts*5);score+=gain;el.classList.add('correct');document.getElementById('feedback').textContent=`✅ Mission complete! The ${o.name.toLowerCase()} is ${m.prep} the landmark. +${gain} points!`;document.getElementById('next').hidden=false;document.getElementById('mic').disabled=true;update();speak(`Excellent! ${o.name}. Mission complete!`)}else{attempts++;el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),700);document.getElementById('feedback').textContent=`❌ That's the ${o.name.toLowerCase()}. Try again! Think about “${m.prep}”.`;if(attempts%3===0&&mode==='normal'){lives--;update();if(lives<=0){locked=true;setTimeout(()=>finish(false),950)}}}}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const feedback=document.getElementById('feedback');if(!SR){feedback.textContent='🎤 Speech recognition is not supported in this browser. Use Chrome/Edge with HTTPS, or click an object.';return}if(recognition){try{recognition.abort()}catch(e){}}const r=new SR();recognition=r;r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;feedback.textContent='🎤 Listening… Say the object name, for example “the key”.';r.onresult=e=>{if(locked)return;const heard=Array.from(e.results[0]).map(a=>norm(a.transcript));let m=missions[stage];let matches=m.items.map((o,i)=>({i,n:norm(o.name).replace(/ [ab]$/,'')})).filter(o=>heard.some(h=>h===o.n||h===`the ${o.n}`||h.includes(` ${o.n} `)||h.endsWith(` ${o.n}`)||h.startsWith(`${o.n} `)));if(matches.length===1){feedback.textContent=`🎤 Heard: “${heard[0]}”`;answer(matches[0].i)}else{feedback.textContent=`🎤 Heard: “${heard[0]}”. ${matches.length>1?'Several objects match. Say the exact label or click it.':'I could not identify an object. Try again or click it.'}`}};r.onerror=e=>{feedback.textContent=`🎤 Microphone: ${e.error}. You can still click or drag objects.`};r.onend=()=>{if(recognition===r)recognition=null};try{r.start()}catch(e){feedback.textContent='🎤 Could not start microphone. Click an object instead.'}}
function finish(won){update();app.innerHTML=`<section class="panel end"><div class="confetti">${won?'🏆🎉🔓':'🕵️💫'}</div><h2>${won?'CASE SOLVED!':'MISSION PAUSED'}</h2><p>${won?'You cracked all 20 location puzzles!':'You ran out of lives. Try again or use Practice mode.'}</p><h2>⭐ ${score} points</h2><p class="muted">${won?(score>=330?'Legendary detective!':score>=240?'Excellent investigator!':'Great detective work!'):'Every detective gets another chance.'}</p><button class="btn" id="again">Play again ↻</button></section>`;document.getElementById('again').onclick=welcome}
welcome();
</script></body></html>
